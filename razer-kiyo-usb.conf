# Razer Kiyo Pro (1532:0e05) — disable USB Link Power Management
# This covers kernel patch 1/3 (USB_QUIRK_NO_LPM) which modifies
# usb/core/quirks.c and can't be built via DKMS.
# Remove once patch 1 ships in your running kernel.
# 'k' = USB_QUIRK_NO_LPM
#
# ⚠️ INEFFECTIVE when usbcore is BUILTIN (true on Ubuntu HWE 6.17 kernels —
# if xhci is builtin, usbcore is too): modprobe.d options never reach builtin
# modules. On such kernels put usbcore.quirks=1532:0e05:k on the kernel
# cmdline instead (README Step 1) and verify the live value with:
#   cat /sys/module/usbcore/parameters/quirks
options usbcore quirks=1532:0e05:k
