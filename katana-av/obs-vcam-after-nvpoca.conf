[Unit]
# OBS reads "nvpoca Cam" (/dev/video11) now, not the Kiyo; wait for its writer before opening the source.
# The format attribute is empty until a writer sets it, so test its content (grep .), not its sysfs size (-s is always true).
After=nvpoca.service
Wants=nvpoca.service

[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ -e /dev/video9 ] && grep -q . /sys/devices/virtual/video4linux/video11/format && exit 0; sleep 1; done; exit 1'
