[Unit]
# OBS reads "nvpoca Cam" (/dev/video11) now, not the Kiyo; wait for its writer before opening the source.
# The format attribute is empty until a writer sets it, so test its content (grep .), not its sysfs size (-s is always true).
After=nvpoca.service
Wants=nvpoca.service

[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ -e /dev/video9 ] && grep -q . /sys/devices/virtual/video4linux/video11/format && exit 0; sleep 1; done; exit 1'
# The room feed (/dev/video12, nvpoca --room-output) for "Brand over room": OBS opens a v4l2 source once, and a loopback
# with exclusive_caps has no capture side until its writer sets a format, so an OBS that starts first keeps a dead
# Room source (2026-11-17 14:55). Best effort: up to 20 s, never fails the start (the room is optional).
ExecStartPre=-/bin/sh -c 'for i in $(seq 1 20); do [ -e /dev/video12 ] || exit 0; grep -q . /sys/devices/virtual/video4linux/video12/format && exit 0; sleep 1; done; exit 0'
