# v4l2loopback — three fixed virtual cameras, created at boot so device numbers never move.
#   /dev/video9   OBS Virtual Camera  (what every call app selects; OBS feeds it)
#   /dev/video10  scrcpy         (phone mirror sink used by the streaming scenes)
#   /dev/video11  nvpoca Cam     (GPU background matting of the Kiyo, fed by the nvpoca user service; OBS reads it)
# OBS ignores card_label and takes the LOWEST output-capable /dev/videoN, so its device
# must be numbered below every other loopback (measured 2026-09-24: it took scrcpy video10).
# exclusive_caps=1 hides the OUTPUT capability from consumers so browsers list it as a camera.
# 2026-11-12: video11 added (Sen); takes effect at the next module load (reboot or OBS quit + modprobe -r).
#   /dev/video12  nvpoca Room    (nvpoca --room-output: the unprocessed camera, under the translucent brand in OBS "Brand over room")
# 2026-11-17: video12 added (ha lane, JP 13:5x); live via v4l2loopback-ctl add, from boot by this line.
options v4l2loopback devices=4 video_nr=9,10,11,12 card_label="OBS Virtual Camera,scrcpy,nvpoca Cam,nvpoca Room" exclusive_caps=1,1,1,1 max_buffers=2
